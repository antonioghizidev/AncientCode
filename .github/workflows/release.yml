name: release

# Dispara em tag v*. A tag E a versao: o mesmo valor vai para o -X da build e
# para o nome do artefato, para que --version e o arquivo instalado concordem
# (spec M16 S7). Se esses dois divergirem, o usuario reporta bug contra a build
# errada e ninguem consegue reproducir.
on:
  push:
    tags: ['v*']
  # Botao "Run workflow" na UI. Sem isto a unica forma de rodar o release e
  # criar tag, e nao ha como REGERAR uma release que ja saiu errada - que e
  # exatamente o que aconteceu com a primeira.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex.: v0.16.0). Sera criada e apontada para o HEAD do branch padrao se ainda nao existir.'
        required: true
        type: string

permissions:
  contents: write # publica a release; sem isto o upload falha

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # O dispatch manual roda a partir do branch padrao, entao o contexto
          # do git nao tem nenhuma tag. Precisa do historico inteiro para o
          # git describe e para o scrub.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A tag e a versao: o mesmo valor vai para o -X da build e para o nome do
      # artefato, para que --version e o arquivo instalado concordem (M16 S7).
      # Num dispatch manual a tag vem do input; num push de tag, do proprio ref.
      - name: resolve a tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            case "$TAG" in v*) ;; *) echo "::error::a tag precisa comecar com v"; exit 1;; esac
            git fetch --tags --force || true
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              # A tag JA existe. O build tem que sair DELA, nao do HEAD do
              # branch padrao: sem isto, re-gerar uma release antiga publicava
              # um binario que responde --version <tag> sem ser o codigo
              # daquela tag. Um `--version` que mente e' pior que nao ter
              # release, porque manda o relato de bug para o commit errado.
              git checkout -f "refs/tags/$TAG"
              # Tag existente tem conteudo imutavel: nao ha o que conferir.
              CREATED=false
            else
              # Cria a tag se ela nao existir: e' o que permite publicar sem
              # forcar ninguem a mexer no repositorio local.
              #
              # `git tag -a` grava um TAGGER no objeto da tag, e o runner nao
              # tem identidade de git configurada. Sem estas duas linhas o
              # passo morre com "Committer identity unknown" - e a tag nem
              # chega a ser criada. Nao e' o autor do commit: e' quem assina a
              # tag, por isso a identidade do bot, nao a do ator.
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "release $TAG" "${GITHUB_SHA}"
              git push origin "refs/tags/$TAG"
              CREATED=true
            fi
          else
            TAG="$REF_NAME"
            # Push de tag e' sempre tag nova: tag existente nao se re-empurra
            # sem --force.
            CREATED=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "tag resolvida: $TAG (nova: $CREATED)"

      # A versao fixada no install.sh e' o que o link estavel do README instala.
      # Se ela nao for a tag que esta saindo, a pagina da release manda instalar a
      # versao anterior - foi o que aconteceu na v0.16.1, que saiu fixando
      # v0.16.0. So' vale para tag NOVA: uma tag existente tem conteudo imutavel,
      # e re-gerar a release dela nao pode mudar o instalador.
      - name: confere a versao fixada do install.sh
        if: steps.tag.outputs.created == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: sh scripts/check-release-version.sh "$TAG"

      # A suite e o portao. Nao e' "rodar tambem": um artefato so' existe se a
      # suite passar. Fail-closed tambem no CI (spec M16).
      - name: suite completa antes de empacotar
        run: go test -count=1 ./...

      - name: vet
        run: go vet ./...

      - name: build do artefato (GOAMD64=v1 por contrato, constitution 7)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist/ancientcode_${TAG}_linux_amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath \
              -ldflags="-s -w -X main.version=${TAG}" \
              -o "dist/ancientcode_${TAG}_linux_amd64/ancientcode" \
              ./cmd/ancientcode
          cp README.md LICENSE install.sh "dist/ancientcode_${TAG}_linux_amd64/"

      # O empacotamento mora num script, e nao aqui, para que o workflow e os
      # testes usem O MESMO empacotador. Quando eram dois, o teste gerava um
      # tarball plano e o workflow um com diretorio de topo: a suite ficava
      # verde e toda release real era recusada pelo install.sh.
      #
      # O instalador so confia no que o SHA256SUMS diz, e ele e' gerado do
      # proprio tarball, nunca editado a mao: um SHA256SUMS escrito a mao e'
      # exatamente o que um atacante com write no repositorio usaria.
      - name: empacota (tarball + SHA256SUMS)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: sh scripts/package-release.sh dist "$TAG"

      - uses: softprops/action-gh-release@v3
        with:
          # OBRIGATORIO. A action deriva a tag de github.ref, e num
          # workflow_dispatch esse ref e' refs/heads/main - nao e' tag, entao a
          # action fica com tag vazia. Sem esta linha o botao "Run workflow"
          # constroi o artefato e falha ao publicar. O input ja resolveu a tag
          # (e criou, se preciso), entao e' ele que manda.
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/ancientcode_${{ steps.tag.outputs.tag }}_linux_amd64.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          # Sem isto, uma tag '-pre' publicada por dispatch nasceria como
          # release normal e viraria a "latest" do repositorio - e o
          # /releases/latest passaria a apontar para uma prerelease.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          make_latest: legacy
          body: |
            ## Como instalar

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.tag.outputs.tag }}/install.sh \
              | ANCIENTCODE_VERSION=${{ steps.tag.outputs.tag }} sh
            ```

            A versão vai explícita **depois do pipe**, prefixando o `sh`: em
            `VAR=x curl ... | sh` a atribuição vale só para o `curl`.

            O instalador confere o `SHA256SUMS` desta mesma release antes de
            extrair. Divergencia = recusa, sem instalação.

            ## Conferir na mao

            ```sh
            sha256sum -c SHA256SUMS
            ./ancientcode --version   # deve dizer ${{ steps.tag.outputs.tag }}
            ```

            Alvo unico: `linux/amd64` com `GOAMD64=v1`, por causa do Core 2 Duo
            sem AVX.

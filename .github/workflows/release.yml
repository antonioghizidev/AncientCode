name: release

# Dispara em tag v*. A tag E a versao: o mesmo valor vai para o -X da build e
# para o nome do artefato, para que --version e o arquivo instalado concordem
# (spec M16 S7). Se esses dois divergirem, o usuario reporta bug contra a build
# errada e ninguem consegue reproducir.
on:
  push:
    tags: ['v*']
  # Botao "Run workflow" na UI. Sem isto a unica forma de rodar o release e
  # criar tag, e nao ha como REGERAR uma release que ja saiu errada - que e
  # exatamente o que aconteceu com a primeira.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex.: v0.16.0). Sera criada e apontada para o HEAD do branch padrao se ainda nao existir.'
        required: true
        type: string

permissions:
  contents: write # publica a release; sem isto o upload falha

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O dispatch manual roda a partir do branch padrao, entao o contexto
          # do git nao tem nenhuma tag. Precisa do historico inteiro para o
          # git describe e para o scrub.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A tag e a versao: o mesmo valor vai para o -X da build e para o nome do
      # artefato, para que --version e o arquivo instalado concordem (M16 S7).
      # Num dispatch manual a tag vem do input; num push de tag, do proprio ref.
      - name: resolve a tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            case "$TAG" in v*) ;; *) echo "::error::a tag precisa comecar com v"; exit 1;; esac
            # Cria a tag se ela nao existir: e o que permite re-gerar uma
            # release sem forcar ninguem a mexer no repositorio local.
            git fetch --tags --force || true
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              git tag -a "$TAG" -m "release $TAG" "${GITHUB_SHA}"
              git push origin "refs/tags/$TAG"
            fi
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag resolvida: $TAG"

      # A suite e o portao. Nao e' "rodar tambem": um artefato so' existe se a
      # suite passar. Fail-closed tambem no CI (spec M16).
      - name: suite completa antes de empacotar
        run: go test -count=1 ./...

      - name: vet
        run: go vet ./...

      - name: build do artefato (GOAMD64=v1 por contrato, constitution 7)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist/ancientcode_${TAG}_linux_amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath \
              -ldflags="-s -w -X main.version=${TAG}" \
              -o "dist/ancientcode_${TAG}_linux_amd64/ancientcode" \
              ./cmd/ancientcode
          cp README.md LICENSE install.sh "dist/ancientcode_${TAG}_linux_amd64/"

      # O instalador so confia no que este arquivo diz. Ele e' gerado do
      # proprio artefato, nunca editado a mao: um SHA256SUMS escrito a mao e'
      # exatamente o que um atacante com write no repositorio usaria.
      - name: tar
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: cd dist && tar -czf "ancientcode_${TAG}_linux_amd64.tar.gz" "ancientcode_${TAG}_linux_amd64"

      # O checksum e' do TARBAL, entao vem depois do tar. A ordem nao e' um
      # detalhe: invertida, o SHA256SUMS descreve um arquivo que ninguem tem.
      - name: SHA256SUMS
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: cd dist && sha256sum "ancientcode_${TAG}_linux_amd64.tar.gz" > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ancientcode_${{ steps.tag.outputs.tag }}_linux_amd64.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Como instalar

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.tag.outputs.tag }}/install.sh | sh
            ```

            O instalador confere o `SHA256SUMS` desta mesma release antes de
            extrair. Divergencia = recusa, sem instalação.

            ## Conferir na mao

            ```sh
            sha256sum -c SHA256SUMS
            ./ancientcode --version   # deve dizer ${{ steps.tag.outputs.tag }}
            ```

            Alvo unico: `linux/amd64` com `GOAMD64=v1`, por causa do Core 2 Duo
            sem AVX.
